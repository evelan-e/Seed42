# docker compose up --build      then open http://localhost:8000
services:
  mock:
    image: python:3.12-slim
    working_dir: /mock
    volumes:
      - ./mock:/mock:ro
    # Add flags here to test failure handling, e.g. --async-create,--fail-rate 0.2, --unstable, --not-ready 409
    command: ["python", "-u", "mock-control-api.py", "--host", "0.0.0.0", "--unstable"]
    ports:
      - "8787:8787"

  pipeline:
    build: ./server
    platform: linux/amd64        # essentia-tensorflow has no Linux arm64 wheels
    env_file:
      - path: .env
        required: false
    environment:
      # The mock container, unless .env sets CONTROL_API_URL (e.g. https://seed42.app)
      CONTROL_API_URL: ${CONTROL_API_URL:-http://mock:8787}
    volumes:
      - models:/models
    ports:
      - "8000:8000"
    depends_on:
      - mock

  # Baseline vs refined comparison: docker compose run --rm eval [args]
  # Reads tracks from eval/tracks and writes eval/results. See eval/compare.py.
  eval:
    build: ./server
    platform: linux/amd64
    profiles: ["eval"]           # not started by docker compose up
    env_file:
      - path: .env
        required: false
    volumes:
      - models:/models
      - ./eval:/srv/eval
    entrypoint: ["python", "eval/compare.py"]

volumes:
  models:
